server {
    listen 80;

    # Fichiers statiques (css, js, images du site)
    location /static/style.css {
        root /usr/share/nginx/html;
    }
    location /static/app.js {
        root /usr/share/nginx/html;
    }
    location /static/logo.png {
        root /usr/share/nginx/html;
    }
    location /static/hero-leaves.jpg {
        root /usr/share/nginx/html;
    }
    location /static/hero-leaves2.jpg {
        root /usr/share/nginx/html;
    }

    # Uploads → backend
    location /static/uploads/ {
        proxy_pass http://backend:8000/static/uploads/;
        proxy_set_header Host $host;
    }

    # API → backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Page principale
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}